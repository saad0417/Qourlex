<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Luxury Obsidian Glass Background -->
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1528"/>
      <stop offset="45%" stop-color="#070C1A"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <!-- Luxury Specular Rim Border -->
    <linearGradient id="fav-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Luxury Top Glass Shine Overlay -->
    <linearGradient id="fav-shine" x1="0" y1="0" x2="64" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Electric Indigo-Cyan Audio Waveform Glow -->
    <linearGradient id="fav-wave" x1="20" y1="20" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="35%" stop-color="#558CF8"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="fav-glow" cx="29.5" cy="30" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#312E81" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base Squircle Tile -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#fav-bg)"/>
  
  <!-- Ambient Inner Glow -->
  <circle cx="29.5" cy="30" r="20" fill="url(#fav-glow)"/>

  <!-- Top Glass Sheen / Luxury Shine Arc -->
  <path d="M1 15 C1 7.3 7.3 1 15 1 L49 1 C56.7 1 63 7.3 63 15 L63 22 C48 30 16 30 1 22 Z" fill="url(#fav-shine)"/>

  <!-- Specular Bevel Border -->
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="url(#fav-border)" stroke-width="1.2"/>

  <!-- White Q Ring (Center 29.5, 30.0, Mean R 16.3, Stroke 6.4) -->
  <circle cx="29.5" cy="30" r="16.3" stroke="#FFFFFF" stroke-width="6.4" fill="none"/>

  <!-- Diagonal Tail with Exact Logo3 Geometry -->
  <path d="M32.4 38.6 L38.8 38.6 L51.0 49.0 L41.6 49.0 Z" fill="#FFFFFF"/>

  <!-- 5 Voice Waveform Bars inside Counter (Proportional to Logo3.png) -->
  <g fill="url(#fav-wave)">
    <rect x="20.4" y="28.0" width="2.6" height="4.0" rx="1.3"/>
    <rect x="24.3" y="25.1" width="2.6" height="9.8" rx="1.3"/>
    <rect x="28.2" y="22.0" width="2.6" height="16.0" rx="1.3"/>
    <rect x="32.1" y="25.1" width="2.6" height="9.8" rx="1.3"/>
    <rect x="36.0" y="28.0" width="2.6" height="4.0" rx="1.3"/>
  </g>
</svg>
